<script>
/* === 施設PC/古ブラウザ対策 安全スクリプト（ES5で記述） ===
   ・JSエラーを画面に赤字表示 → 「白画面で原因不明」を防ぐ
   ・ctx.roundRect ポリフィル（Edge/Chrome 99未満で無く白画面になる対策） */
(function () {
  function showErr(msg) {
    try {
      var d = document.getElementById('__err');
      if (!d) {
        d = document.createElement('div');
        d.id = '__err';
        d.style.cssText = 'position:fixed;left:0;top:0;right:0;bottom:0;z-index:99999;background:#101426;color:#ffdada;font:14px/1.7 monospace;padding:18px;overflow:auto;white-space:pre-wrap';
        (document.body || document.documentElement).appendChild(d);
      }
      d.appendChild(document.createTextNode('⚠ ' + msg + '\n'));
    } catch (e) {}
  }
  window.addEventListener('error', function (e) {
    showErr((e && e.message ? e.message : 'error') + '  @line ' + (e && e.lineno ? e.lineno : '?'));
  });
  window.addEventListener('unhandledrejection', function (e) {
    showErr('Promise: ' + (e && e.reason ? e.reason : ''));
  });
  try {
    var P = window.CanvasRenderingContext2D && CanvasRenderingContext2D.prototype;
    if (P && !P.roundRect) {
      P.roundRect = function (x, y, w, h, r) {
        var a;
        if (typeof r === 'number') { a = [r, r, r, r]; }
        else if (r && r.length) {
          if (r.length === 1) { a = [r[0], r[0], r[0], r[0]]; }
          else if (r.length === 2) { a = [r[0], r[1], r[0], r[1]]; }
          else if (r.length === 3) { a = [r[0], r[1], r[2], r[1]]; }
          else { a = [r[0], r[1], r[2], r[3]]; }
        } else { a = [0, 0, 0, 0]; }
        var m = Math.min(Math.abs(w), Math.abs(h)) / 2;
        var tl = Math.min(a[0], m), tr = Math.min(a[1], m), br = Math.min(a[2], m), bl = Math.min(a[3], m);
        this.moveTo(x + tl, y);
        this.arcTo(x + w, y, x + w, y + h, tr);
        this.arcTo(x + w, y + h, x, y + h, br);
        this.arcTo(x, y + h, x, y, bl);
        this.arcTo(x, y, x + w, y, tl);
        this.closePath();
        return this;
      };
    }
  } catch (e) {}
})();
</script>

<script>
'use strict';
/* =====================================================
   クルルの発電所 — 電気の利用（小6理科・協力型・1ファイル）
   発電してみよう（メイン操作・数値階段①〜⑦）→
   ためて使おう（メイン操作・時間送り①〜⑦）→
   豆電球とLED（メイン操作・時間送り①〜⑦・比較）→
   センサーで守ろう（発見型）→ はかせ（身のまわりの利用）。
   数値：手回し発電機は速く回すほど電圧が大きくなる（1秒に2〜3回が目安）、
   白色LEDは2.5〜2.7Vで点灯、コンデンサーにためた電気で比べると
   豆電球はやく30秒で消え、LEDは5分(300秒)たってもついている。
   ===================================================== */

// ---------- ユーティリティ ----------
const $ = id => document.getElementById(id);
const TAU = Math.PI * 2;
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const ruby = (k, f) => `<ruby>${k}<rt>${f}</rt></ruby>`;
function easeInOut(x) { return x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2; }
function lerpArr(arr, floatIdx) {
  const last = arr.length - 1;
  const i0 = clamp(Math.floor(floatIdx), 0, last), i1 = clamp(Math.ceil(floatIdx), 0, last), f = floatIdx - i0;
  return arr[i0] + (arr[i1] - arr[i0]) * f;
}

const W = {
  hatsuden: ruby('発電', 'はつでん'),
  hatsudenki: ruby('発電機', 'はつでんき'),
  chikuden: ruby('蓄電', 'ちくでん'),
  denatsu: ruby('電圧', 'でんあつ'),
  denki: ruby('電気', 'でんき'),
  mame: ruby('豆電球', 'まめでんきゅう'),
  led: 'LED（' + ruby('発光', 'はっこう') + 'ダイオード）',
  jinkan: ruby('人感', 'じんかん'),
  seirei: ruby('精霊', 'せいれい'),
  bousai: ruby('防災', 'ぼうさい'),
  seigyo: ruby('制御', 'せいぎょ'),
};

const NUMS = '①②③④⑤⑥⑦⑧';

// ---------- 数値データ（本物度） ----------
// m_hatsuden：発電してみよう（メイン操作・数値階段①〜⑦、単位V）
// 手回し発電機は回す速さを上げるほど電圧が大きくなる。目標2.5V以上（白色LEDが光る電圧の目安）
const HATSUDEN_V = [0, 0.8, 1.4, 2.0, 2.6, 3.2, 3.8, 4.4];
const HATSUDEN_TARGET = 2.5;
function hatsudenState(v) {
  if (v >= HATSUDEN_TARGET) return { ok: true, label: 'しっかり 光っている！（目ひょう達成）' };
  if (v >= 1.2) return { ok: false, label: 'すこし 光っている' };
  return { ok: false, label: 'ほとんど 光っていない' };
}

// m_chikuden：ためて使おう（メイン操作・時間送り①〜⑦、単位%）

// ---------- 音 ----------
let AC = null;
function ac() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(freq, delay, dur, type, vol) {
  const c = ac(); if (!c || !S.sound) return;
  const t0 = c.currentTime + delay;
  const o = c.createOscillator(), g = c.createGain();
  o.type = type || 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t0);
  const savedVolume = Number(localStorage.getItem('seVolume') ?? 0.8);
  const lessonVolume = Number.isFinite(savedVolume) ? Math.max(0, Math.min(1, savedVolume)) : 0.8;
  g.gain.linearRampToValueAtTime((vol || 0.12) * lessonVolume, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  o.connect(g); g.connect(c.destination);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
const sTap = () => tone(660, 0, 0.09, 'triangle', 0.07);
const sYes = () => [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, i * 0.09, 0.5, 'triangle', 0.11));

// ---------- キャンバス ----------
const stageCv = $('stage'), scopeCv = $('scope'), fxCv = $('fx');
const gctx = stageCv.getContext('2d'), sctx = scopeCv.getContext('2d'), fctx = fxCv.getContext('2d');
function fitCanvas(cv) {
  const r = cv.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
  const w = Math.max(1, Math.round(r.width * dpr)), h = Math.max(1, Math.round(r.height * dpr));
  if (cv.width !== w || cv.height !== h) { cv.width = w; cv.height = h; }
  return { w: r.width, h: r.height, dpr };
}

// ---------- 座標変換 ----------
const PAD_T = 54, PAD_B = 60, PAD_X = 10;
const MAPW = 1000, MAPH = 640;
function mapTransform(w, h) {
  const sc = Math.min((w - PAD_X * 2) / MAPW, (h - PAD_T - PAD_B) / MAPH);
  const ox = PAD_X + (w - PAD_X * 2 - MAPW * sc) / 2;
  const oy = PAD_T + (h - PAD_T - PAD_B - MAPH * sc) / 2;
  return { sc, ox, oy };
}
function roundRect(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function bgFill(X, Y, sc) {
  const g = gctx.createLinearGradient(0, Y(0), 0, Y(640));
  g.addColorStop(0, '#fffaf0'); g.addColorStop(1, '#ffdd8a');
  gctx.fillStyle = g; gctx.fillRect(X(0), Y(0), 1000 * sc, 640 * sc);
  gctx.fillStyle = '#fff3d2';
  gctx.fillRect(X(0), Y(520), 1000 * sc, 120 * sc);
}

// ---------- 手回し発電機の共通描画 ----------
function drawGenerator(X, Y, sc, cx, cy, spinAngle, glowT) {
  gctx.fillStyle = '#eceff1'; gctx.strokeStyle = '#455a64'; gctx.lineWidth = 2.4 * sc;
  roundRect(gctx, X(cx - 55), Y(cy - 35), 110 * sc, 70 * sc, 10 * sc);
  gctx.fill(); gctx.stroke();
  gctx.save();
  gctx.translate(X(cx + 40), Y(cy));
  gctx.rotate(spinAngle);
  gctx.strokeStyle = '#8d6e63'; gctx.lineWidth = 5 * sc; gctx.lineCap = 'round';
  gctx.beginPath(); gctx.moveTo(0, 0); gctx.lineTo(26 * sc, 0); gctx.stroke();
  gctx.beginPath(); gctx.arc(26 * sc, 0, 7 * sc, 0, TAU); gctx.fillStyle = '#bdbdbd'; gctx.fill();
  gctx.strokeStyle = '#616161'; gctx.lineWidth = 1.6 * sc; gctx.stroke();
  gctx.restore();
  gctx.beginPath(); gctx.arc(X(cx + 40), Y(cy), 8 * sc, 0, TAU); gctx.fillStyle = '#455a64'; gctx.fill();
  gctx.fillStyle = '#3a2e10'; gctx.font = `700 ${13 * sc}px sans-serif`; gctx.textAlign = 'center'; gctx.textBaseline = 'middle';
  gctx.fillText('手回し発電機', X(cx), Y(cy + 50));

    gctx.shadowColor = '#ffd54f'; gctx.shadowBlur = 14 * sc;
    gctx.strokeStyle = '#ffb300'; gctx.lineWidth = 3 * sc;

}
function drawBulb(X, Y, sc, cx, cy, brightness, kind) {
  const b = clamp(brightness, 0, 1);
  if (kind === 'led') {
    if (b > 0.03) {
      gctx.save(); gctx.globalAlpha = 0.5 * b;
      const g = gctx.createRadialGradient(X(cx), Y(cy), 0, X(cx), Y(cy), 48 * sc);
      g.addColorStop(0, '#dcffff'); g.addColorStop(1, 'rgba(200,255,255,0)');
      gctx.fillStyle = g; gctx.beginPath(); gctx.arc(X(cx), Y(cy), 48 * sc, 0, TAU); gctx.fill();
      gctx.restore();
    }
    gctx.fillStyle = b > 0.03 ? `rgba(170,235,255,${0.5 + 0.5 * b})` : '#cfd8dc';
    gctx.strokeStyle = '#37474f'; gctx.lineWidth = 2 * sc;
    gctx.beginPath(); gctx.arc(X(cx), Y(cy - 4), 16 * sc, Math.PI, 0);
    gctx.lineTo(X(cx) + 16 * sc, Y(cy) + 16 * sc); gctx.lineTo(X(cx) - 16 * sc, Y(cy) + 16 * sc); gctx.closePath();
    gctx.fill(); gctx.stroke();
    gctx.fillStyle = '#9e9e9e'; gctx.fillRect(X(cx) - 7 * sc, Y(cy) + 16 * sc, 14 * sc, 9 * sc);
  } else {
    if (b > 0.03) {
      gctx.save(); gctx.globalAlpha = 0.55 * b;
      const g = gctx.createRadialGradient(X(cx), Y(cy), 0, X(cx), Y(cy), 52 * sc);
      g.addColorStop(0, '#fff3b0'); g.addColorStop(1, 'rgba(255,220,120,0)');
      gctx.fillStyle = g; gctx.beginPath(); gctx.arc(X(cx), Y(cy), 52 * sc, 0, TAU); gctx.fill();
      gctx.restore();
    }
    gctx.fillStyle = b > 0.03 ? `rgba(255,220,120,${0.55 + 0.45 * b})` : '#e6e0d0';
    gctx.strokeStyle = '#8d6e63'; gctx.lineWidth = 2 * sc;
    gctx.beginPath(); gctx.arc(X(cx), Y(cy), 19 * sc, 0, TAU); gctx.fill(); gctx.stroke();
    gctx.fillStyle = b > 0.03 ? '#e65100' : '#a09070';
    gctx.beginPath(); gctx.arc(X(cx), Y(cy), 4 * sc, 0, TAU); gctx.fill();
    gctx.fillStyle = '#9e9e9e'; gctx.fillRect(X(cx) - 8 * sc, Y(cy) + 19 * sc, 16 * sc, 10 * sc);
  }
}
function drawCapacitor(X, Y, sc, cx, cy, pct, label) {
  const w = 58, h = 92;
  gctx.strokeStyle = '#455a64'; gctx.lineWidth = 2.4 * sc;
  roundRect(gctx, X(cx - w / 2), Y(cy - h / 2), w * sc, h * sc, 8 * sc);
  gctx.fillStyle = '#fff'; gctx.fill(); gctx.stroke();
  gctx.save();
  roundRect(gctx, X(cx - w / 2), Y(cy - h / 2), w * sc, h * sc, 8 * sc); gctx.clip();
  const fh = h * (clamp(pct, 0, 100) / 100);
  gctx.fillStyle = pct >= 100 ? '#66bb6a' : '#ffca28';
  gctx.fillRect(X(cx - w / 2), Y(cy + h / 2 - fh), w * sc, fh * sc);
  gctx.restore();

  gctx.fillText(label || 'コンデンサー', X(cx), Y(cy + h / 2 + 20));
  gctx.font = `700 ${16 * sc}px sans-serif`;
  gctx.fillText(Math.round(pct) + '%', X(cx), Y(cy));
}

// ---------- ステージ描画 ----------
function drawStage(t, dt) {
  const { w, h, dpr } = fitCanvas(stageCv);
  gctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  gctx.clearRect(0, 0, w, h);
  const { sc, ox, oy } = mapTransform(w, h);
  const X = x => ox + x * sc, Y = y => oy + y * sc;
  if (S.scene === 'hatsuden') drawHatsudenScene(X, Y, sc, t);
  else if (S.scene === 'chikuden') drawChikudenScene(X, Y, sc, t);
  else if (S.scene === 'mameled') drawMameledScene(X, Y, sc);
  else if (S.scene === 'sensor') drawSensorScene(X, Y, sc);
  else if (S.scene === 'hakase') drawHakaseScene(X, Y, sc);
  else if (S.scene === 'done') drawHakaseScene(X, Y, sc);
}

// ---------- クルルレンズ（丸窓） ----------
function drawScope(t, dt) {
  const { w, h, dpr } = fitCanvas(scopeCv);
  sctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  sctx.clearRect(0, 0, w, h);
  const R = w / 2;

  let grd = sctx.createRadialGradient(R, R, 0, R, R, R);
  grd.addColorStop(0, '#fffdf2'); grd.addColorStop(1, '#e6cf94');
  sctx.fillStyle = grd; sctx.fillRect(0, 0, w, h);

  const mode = S.scope.type;
  if (mode === 'volt') {
    drawVoltMeter(R, S.scope.v);
    label(S.scope.label || '');
  } else if (mode === 'charge') {
    drawChargeRing(R, S.scope.pct);
    label(S.scope.label || '');
  } else if (mode === 'dual') {
    drawDualBars(R, S.scope.mame, S.scope.led);
    label(S.scope.label || '');
  } else if (mode === 'point') {
    sctx.fillStyle = '#2e7d32';
    sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText(S.scope.icon || '🔍', R, R * 0.85);
    label(S.scope.name || '');
  } else if (mode === 'glow') {
    const g2 = sctx.createRadialGradient(R, R * 0.85, 0, R, R * 0.85, R * 0.7);
    g2.addColorStop(0, '#ffe58a88'); g2.addColorStop(1, 'rgba(255,229,138,0)');
    sctx.fillStyle = g2; sctx.beginPath(); sctx.arc(R, R * 0.85, R * 0.7, 0, TAU); sctx.fill();
    sctx.fillStyle = '#2e7d32'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('⚡', R, R * 0.85);
    label('かんせい！');
  } else {
    sctx.fillStyle = '#2e7d32'; sctx.font = `${R * 0.4}px sans-serif`; sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    sctx.fillText('🔍', R, R * 0.85);
    label('お話を きいてみよう');
  }

  function label(txt) {
    sctx.font = `700 ${R * 0.098}px sans-serif`;
    sctx.textAlign = 'center'; sctx.textBaseline = 'middle';
    const ly = h - R * 0.24;
    const tw = sctx.measureText(txt).width;
    sctx.fillStyle = 'rgba(255,255,255,.88)';
    sctx.beginPath();
    sctx.roundRect(R - tw / 2 - 8, ly - R * 0.09, tw + 16, R * 0.18, R * 0.09);
    sctx.fill();
    sctx.fillStyle = '#3a2e10';
    sctx.fillText(txt, R, ly);
  }

  function drawVoltMeter(R, v) {
    const cx = R, cy = R * 0.78, mr = R * 0.55, maxV = 4.5;
    const frac = clamp(v / maxV, 0, 1);
    sctx.lineWidth = R * 0.1; sctx.lineCap = 'round';
    sctx.beginPath(); sctx.arc(cx, cy, mr, Math.PI, 0); sctx.strokeStyle = 'rgba(46,125,50,.16)'; sctx.stroke();
    sctx.beginPath(); sctx.arc(cx, cy, mr, Math.PI, Math.PI + Math.PI * frac);
    sctx.strokeStyle = v >= HATSUDEN_TARGET ? '#2e7d32' : v >= 1.2 ? '#ffb300' : '#9fbf9d';
    sctx.stroke();
    const ang = Math.PI + Math.PI * frac;
    sctx.beginPath(); sctx.moveTo(cx, cy); sctx.lineTo(cx + Math.cos(ang) * mr * 0.85, cy + Math.sin(ang) * mr * 0.85);
    sctx.strokeStyle = '#3a2e10'; sctx.lineWidth = R * 0.03; sctx.stroke();
    sctx.beginPath(); sctx.arc(cx, cy, R * 0.05, 0, TAU); sctx.fillStyle = '#3a2e10'; sctx.fill();
  }

  function drawChargeRing(R, pct) {
    const cx = R, cy = R * 0.78, mr = R * 0.55;
    const frac = clamp(pct / 100, 0, 1);
    sctx.lineWidth = R * 0.13; sctx.lineCap = 'round';
    sctx.beginPath(); sctx.arc(cx, cy, mr, Math.PI, 0); sctx.strokeStyle = 'rgba(46,125,50,.16)'; sctx.stroke();
    sctx.beginPath(); sctx.arc(cx, cy, mr, Math.PI, Math.PI + Math.PI * frac);
    sctx.strokeStyle = pct >= 100 ? '#2e7d32' : '#ffb300'; sctx.stroke();
  }

  function drawDualBars(R, mp, lp) {
    const barW = R * 0.26, barH = R * 0.85, baseY = R * 1.5;
    [[R * 0.62, mp, '#ff8f4d', '豆'], [R * 1.38, lp, '#4fd7ea', 'LED']].forEach(a => {
      const cx = a[0], p = a[1], col = a[2], lb = a[3];
      const bx = cx - barW / 2, by = baseY - barH;
      sctx.strokeStyle = '#c98a12'; sctx.lineWidth = 2; sctx.strokeRect(bx, by, barW, barH);
      const fh = barH * (clamp(p, 0, 100) / 100);
      sctx.globalAlpha = p > 0 ? 1 : 0.25;
      sctx.fillStyle = col; sctx.fillRect(bx, baseY - fh, barW, fh);
      sctx.globalAlpha = 1;
      sctx.fillStyle = '#3a2e10'; sctx.font = `700 ${R * 0.09}px sans-serif`; sctx.textAlign = 'center';
      sctx.fillText(lb, cx, baseY + R * 0.13);
      sctx.font = `700 ${R * 0.08}px sans-serif`;
      sctx.fillText(Math.round(p) + '%', cx, by - R * 0.06);
    });
  }
}

// ---------- キラキラ ----------
let particles = [];
function burst(x, y, n) {
  for (let i = 0; i < (n || 70); i++) {
    const a = Math.random() * TAU, sp = 60 + Math.random() * 260;
    particles.push({
      x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 60,
      life: 1, size: 2 + Math.random() * 4,
      col: ['#66bb6a', '#ffb300', '#ffe58a', '#fff'][Math.floor(Math.random() * 4)],
    });
  }
}
function scopeBurst() {
  const r = $('scopeWrap').getBoundingClientRect();
  burst(r.left + r.width / 2, r.top + r.height / 2);
}
function drawFx(dt) {
  const { w, h, dpr } = fitCanvas(fxCv);
  fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fctx.clearRect(0, 0, w, h);
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => {
    p.life -= dt * 0.7; p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 140 * dt;
    fctx.globalAlpha = Math.max(0, p.life);
    fctx.fillStyle = p.col;
    fctx.save();
    fctx.translate(p.x, p.y); fctx.rotate(p.life * 5);
    const s = p.size;
    fctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const a1 = i * TAU / 5 - Math.PI / 2;
      fctx.lineTo(Math.cos(a1) * s, Math.sin(a1) * s);
      const a2 = a1 + TAU / 10;
      fctx.lineTo(Math.cos(a2) * s * 0.45, Math.sin(a2) * s * 0.45);
    }
    fctx.closePath(); fctx.fill();
    fctx.restore();
  });
  fctx.globalAlpha = 1;
}

// ---------- 汎用トゥイーン ----------
function startTween(from, to, dur, setter, onDone) {
  setter(from);
  S.tween = { t: 0, dur, from, to, setter, onDone, fired: false };
}

// ---------- メインループ ----------
let lastT = performance.now();
function loop(now) {
  const t = now / 1000, dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  if (S.tween) {
    const tw = S.tween;
    tw.t = clamp(tw.t + dt / tw.dur, 0, 1);
    tw.setter(lerp(tw.from, tw.to, easeInOut(tw.t)));
    if (tw.t >= 1 && !tw.fired) {
      tw.fired = true;
      const cb = tw.onDone;
      S.tween = null;
      if (cb) cb();
    }
  }
  drawStage(t, dt);
  drawScope(t, dt);
  drawFx(dt);
  requestAnimationFrame(loop);
}

      hideWish(); setButtons([]);
      say(`センサーを 使うと、${W.denki}の 使い方は どうなる？`);
      setButtons(choiceRow(['いつも全部つけっぱなしにできる', '必要なときだけ自動で使い、むだをへらせる', '電気をまったく使わなくてすむ'], (i, el) => this.judge(i, el)));
    },
    judge(i, el) {
      markPicked(el);
      if (i === 1) {
        sYes(); scopeBurst(); award('m_sensor'); S.phase = 'done';
        say(`せいかい！ センサーを 使うと、必要な ときだけ 自動で ${W.denki}を 使い、むだを へらすことが できる。「明るさで 点ける」「人が いなければ 消す」のように コンピューターに じょうけんを おぼえさせる、プログラミングの 力でもあるんだ。`);
        setButtons([{ label: 'つぎへ（はかせチャレンジ）', cb: nextStep }]);
      } else {
        say(`ヒントを もういちど 見て、いっしょに かんがえよう。`);
        setButtons(choiceRow(['いつも全部つけっぱなしにできる', '必要なときだけ自動で使い、むだをへらせる', '電気をまったく使わなくてすむ'], (i2, el2) => this.judge(i2, el2)));
      }
    },
  },

  // --- はかせチャレンジ：身のまわりの発電・蓄電・センサー ---
  hakase: {
    enter() {
      Object.assign(S, { scene: 'hakase', scope: { type: 'idle' }, hakaseFound: new Set() });
      updateLoc();
      say(`さいごは <b>はかせチャレンジ</b>！ ${W.denki}を 作る・ためる・かしこく 使う くふうは、身のまわりに たくさん あるよ。`);
      this.refreshCtl();
    },
    refreshCtl() {
      setButtons(HAKASE_POINTS.map(p => ({
        label: p.letter + ' ' + p.name + (S.hakaseFound.has(p.key) ? ' ✓' : ''),
        cb: () => this.reveal(p),
      })));
      if (S.hakaseFound.size >= HAKASE_POINTS.length) {
        setButtons([{ label: 'クイズに ちょうせん', cb: () => this.ask() }]);
      }
    },
    reveal(p) {
      sTap(); S.hakaseFound.add(p.key);
      S.scope = { type: 'point', name: p.name, icon: p.icon };
      scopeBurst();
      say(p.txt);
      this.refreshCtl();
    },
    ask() {
      hideWish();
      say(`太陽光発電は、天気に よって 発電できる 量が 変わる。いちばん たくさん 発電できるのは？`);
      setButtons(choiceRow(['くもりの日', '晴れの日', '雨の日'], (i, el) => this.judge(i, el)));
    },
    judge(i, el) {
      markPicked(el);
      if (i === 1) {
        sYes(); scopeBurst(); award('hakase'); S.phase = 'done';
        say(`せいかい！ 太陽光発電は、日光が 強い <b>晴れの日</b>に いちばん たくさん 発電できる。天気に よって 発電量が 変わるのも、自然の ${W.denki}の おもしろい ところ。`);
        setButtons([{ label: 'ふりかえりタイムへ', cb: nextStep }]);
      } else {
        say(`ヒントを もういちど 見て、いっしょに かんがえよう。`);
        setButtons(choiceRow(['くもりの日', '晴れの日', '雨の日'], (i2, el2) => this.judge(i2, el2)));
      }
    },
  },

  // --- ふりかえりタイム：4ミッションの場面を1つずつ見せ直す ---
  m_furikaeri: {
    enter() {
      S.furikaeriIdx = 0;
      this.show();
    },
    show() {
      const slide = FURIKAERI_SLIDES[S.furikaeriIdx];
      const n = S.furikaeriIdx + 1, total = FURIKAERI_SLIDES.length;
      const isLast = S.furikaeriIdx >= total - 1;
      slide.setup();
      Object.assign(S, { scene: slide.scene, scope: slide.scope() });
      updateLoc();
      const goNext = () => {
        sTap();
        if (isLast) { hideOverlay(); nextStep(); } else { S.furikaeriIdx++; this.show(); }
      };
      if (slide.video) {
        const videoUrl = `https://www.youtube.com/watch?v=${slide.video}`;
        const canEmbed = slide.embeddable !== false;
        showOverlay(`
          <h2>${slide.icon} ふりかえりタイム（${n}/${total}）${slide.title}</h2>
          <div id="furikaeriThumb" style="max-width:380px;margin:0 auto;cursor:pointer">
            <div style="position:relative;border-radius:12px;overflow:hidden;background:#000">
              <img src="https://img.youtube.com/vi/${slide.video}/hqdefault.jpg" style="width:100%;display:block;opacity:.85">
              <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">
                <div style="width:15%;aspect-ratio:1;min-width:56px;border-radius:50%;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;color:#fff;font-size:clamp(24px,3vw,34px)">▶</div>
              </div>
            </div>
            <div style="margin-top:.5em;color:#3a7ab8;font-size:clamp(12px,1.3vw,16px)">${canEmbed ? 'タップすると この画面で 動画が はじまるよ' : 'タップすると 新しい タブで 動画が ひらくよ'}</div>
          </div>
          <p class="talk">${slide.text()}</p>
          <button class="btn" id="furikaeriNextBtn">${isLast ? 'まとめへ すすむ' : 'つぎへ'}</button>
          <div class="foot">先生へ：動画はYouTubeの教育系チャンネルです。内容を事前にご確認ください。URL: ${videoUrl}</div>
        `);
        $('furikaeriThumb').onclick = () => {
          sTap();
          if (canEmbed) {
            const embedUrl = `https://www.youtube-nocookie.com/embed/${slide.video}?rel=0&modestbranding=1&iv_load_policy=3&autoplay=1`;
            $('furikaeriThumb').outerHTML = `<div style="max-width:380px;margin:0 auto;border-radius:12px;overflow:hidden;aspect-ratio:16/9;background:#000"><iframe width="100%" height="100%" src="${embedUrl}" title="${slide.title}" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>`;
          } else {
            window.open(videoUrl, '_blank', 'noopener');
          }
        };
        $('furikaeriNextBtn').onclick = goNext;
      } else {
        hideOverlay();
        scopeBurst();
        say(`<b>ふりかえりタイム（${n}/${total}）${slide.icon} ${slide.title}</b><br>${slide.text()}`);
        setButtons([{ label: isLast ? 'まとめへ すすむ' : 'つぎへ', cb: goNext }]);
      }
    },
  },

  ending: {
    enter() {
      window.yomitabiLessonComplete?.(S.badges.size, 5);
      Object.assign(S, { scene: 'done', scope: { type: 'glow' } });
      updateLoc();
      const votedRight = S.votePicked.has(1);
      showOverlay(`
        <h2>⭐ クルルの発電所 みならい にんてい！ ⭐</h2>
        <div class="phasesStrip">${'★'.repeat(S.badges.size)}${'☆'.repeat(Math.max(0, 5 - S.badges.size))}</div>
        <p class="talk" id="blankArea">きょうの <b>4つの ひみつ</b>、いえるかな？（タッチで こたえ）<br>
        ① 手回し発電機は ハンドルを（<span class="blankWord" data-a="はやく">？？？</span>）回すほど、発電する ${W.denatsu}が（<span class="blankWord" data-a="大きく">？？？</span>）なる。<br>
        ② コンデンサーに ${W.denki}を（<span class="blankWord" data-a="ためて">？？？</span>）おくと、あとで 使うことが できる。<br>
        ③ 同じ 量の ${W.denki}で くらべると、（<span class="blankWord" data-a="LED">？？？</span>）の方が ${W.mame}より ずっと 長く 光り続ける。<br>
        ④ センサーを 使うと、必要な ときだけ ${W.denki}を 使い、むだを（<span class="blankWord" data-a="へらせる">？？？</span>）。</p>
        <p class="talk">さいしょの よそうタイム、こたえは <b>イ LEDの方が長い</b>でした！${votedRight ? '（みんなの よそう、ばっちり！）' : ''}</p>
        <p class="talk">🏠 <b>おうちミッション</b><br>家の中で、${W.hatsuden}・${W.chikuden}・センサーを 使っている ものを <b>3つ</b> さがしてみよう。れい：モバイルバッテリー、リモコンの かん電池、げんかんの センサーライト、自動水せん など。</p>
        <div style="display:flex;gap:1vw;justify-content:center;flex-wrap:wrap;margin-top:1.5vh">
          <button class="btn" id="freeBtn">じゆうモードで あそぶ</button>
          <button class="btn sub" id="againBtn">はじめから もういちど</button>
        </div>
      `);
      sFanfare();
      setTimeout(scopeBurst, 200);
      panelEl.querySelectorAll('.blankWord').forEach(sp => {
        sp.onclick = function () {
          this.textContent = this.dataset.a;
          this.style.color = '#2e7d32'; sYes(); scopeBurst();
        };
      });
      $('freeBtn').onclick = () => { sTap(); gotoStep(FLOW.indexOf('free')); };
      $('againBtn').onclick = () => { location.reload(); };
    },
  },

  free: {
    enter() {
      Object.assign(S, { scene: 'hakase', scope: { type: 'glow' } });
      updateLoc();
      say(`<b>じゆうモード</b>だよ！ ${ruby('友', 'とも')}だちと クイズを 出しあおう。<br>れい：「手回し発電機を はやく 回すと 電圧は？」「豆電球と LED、どちらが 長く 光る？」「センサーを 使うと 電気の むだは？」`);
      setButtons([
        { label: '⚡ 発電の図', cls: 'sub', cb: () => this.show('hatsuden') },
        { label: '🔋 ためる図', cls: 'sub', cb: () => this.show('chikuden') },
        { label: '💡 豆電球とLEDの図', cls: 'sub', cb: () => this.show('mameled') },
        { label: '📡 センサーの図', cls: 'sub', cb: () => this.show('sensor') },
        { label: '🔎 はかせチャレンジの図', cls: 'sub', cb: () => this.show('hakase') },
        { label: 'まとめに もどる', cls: 'sub', cb: () => gotoStep(FLOW.indexOf('ending')) },
      ]);
    },
    show(scene) { S.scene = scene; updateLoc(); sTap(); },
  },
};

// ---------- 先生バー ----------
$('tbPrev').onclick = () => gotoStep(S.stepIndex - 1);
$('tbNext').onclick = () => gotoStep(S.stepIndex + 1);
$('tbReset').onclick = () => location.reload();
$('tbSound').onclick = function () { S.sound = !S.sound; this.textContent = S.sound ? '🔊' : '🔇'; };

// ---------- 開始 ----------
// （URLの後ろに ?step=m_mameled などで途中から始められます）
gotoStep(0);
requestAnimationFrame(loop);
</script>
</body>
</html>
