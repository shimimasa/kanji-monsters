<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>ヒョウと村の声をあつめよう・きろくシート</title><link rel="stylesheet" href="./sheet.css"></head>
<body>
  <h1>🗳️ ヒョウと 村の 声を あつめよう</h1>
  <p class="byline">考えに 正解は ひとつだけでは ないよ。ちがう 願いも 大切に しよう。</p>
  <div class="field">なまえ <span></span> ひづけ <span></span></div>
  <section><h2>1. 村の 声</h2><p>カワワタ・オネガミ・チズリンは、何を 願っていた？</p><div class="line"></div></section>
  <section><h2>2. 選挙の 歴史</h2><p>投票できる 人は どう 変わってきた？</p><div class="line"></div></section>
  <section><h2>3. ひみつの 一票</h2><p>だれに 投票したかが 見えないのは、なぜ 大切？</p><div class="line"></div></section>
  <section><h2>4. 参加する 人</h2><p>全員と 半分の 村の 例では、結果は どう 変わった？</p><div class="line"></div></section>
  <section><h2>5. 自分の 一票</h2><p>どの 提案を えらんだ？ そう 思った 理由は？</p><div class="line"></div><div class="line"></div></section>
  <button type="button" onclick="window.print()">いんさつする</button>
</body></html>
