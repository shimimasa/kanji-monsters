<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=overlays-content, viewport-fit=cover">
  <title>漢字ヨミタビ</title>
  <link rel="stylesheet" href="/style.css" />
  <link rel="manifest" href="/manifest.json" />
  <meta name="theme-color" content="#1e90ff" />
</head>
<script>
  // PWAは一旦撤退（sw.jsが不正な内容のまま配布されていたため）。
  // 過去に登録されたService Workerが残っている端末があれば解除する。
  //
  // NOTE: 以前は load 後に unregister するだけだった。しかしその時点では
  // HTML もモジュールも「古いSWのキャッシュから」配られ終わっている。
  // さらに unregister しても、いま開いているページの controller は生きたままで、
  // Cache Storage（learning-platform-v1 など）も残る。
  // その結果、古い端末では直したはずの版がいつまでも出てこない
  // （＝教室で「直したのに反映されない」が起きる）。実際にキャッシュから
  // 古い main.js が配られている状態を確認した。
  // そこで「SWに配られている時だけ、掃除して1回だけ読み直す」ようにする。
  if ('serviceWorker' in navigator) {
    (async () => {
      try {
        const regs = await navigator.serviceWorker.getRegistrations();
        const isYomitabiCache = name => /^(learning-platform-v1|kanji-battle-|yomitabi-)/.test(name);
        const isYomitabiWorker = registration => {
          const worker = registration.active || registration.waiting || registration.installing;
          try {
            const url = new URL(worker?.scriptURL || '', location.href);
            return url.origin === location.origin && url.pathname === '/sw.js';
          } catch { return false; }
        };
        const ownRegs = regs.filter(isYomitabiWorker);
        const controlled = (() => {
          try {
            const url = new URL(navigator.serviceWorker.controller?.scriptURL || '', location.href);
            return url.origin === location.origin && url.pathname === '/sw.js';
          } catch { return false; }
        })();
        if (!ownRegs.length && !controlled) return;

        await Promise.all(ownRegs.map(r => r.unregister().catch(() => {})));
        if (window.caches) {
          const names = await caches.keys();
          await Promise.all(names.filter(isYomitabiCache).map(n => caches.delete(n).catch(() => {})));
        }

        // 読み直しは1回だけ。ループにならないようセッションに印を置く。
        if (controlled && !sessionStorage.getItem('swCleanupReloaded')) {
          sessionStorage.setItem('swCleanupReloaded', '1');
          location.reload();
        }
      } catch {}
    })();
  }
</script>
<body>
  <!-- ローディング画面用コンテナ -->
  <div id="loader"></div>

  <canvas id="gameCanvas"></canvas>
  <div id="monsterContainer"></div>
  <!-- バトル時だけ表示する入力欄 -->
  <input type="text" id="kanjiInput" autocomplete="off" />

  <!-- 最後にアプリ本体を module で読み込む -->
  <script type="module" src="/src/main.js"></script>
</body>
</html>
